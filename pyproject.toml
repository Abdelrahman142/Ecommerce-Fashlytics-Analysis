[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipkart-fashion-bi"
version = "1.0.0"
description = "Fashion product intelligence platform built from Flipkart data (ETL -> star schema -> dashboard)"
requires-python = ">=3.11"
dependencies = [
    "ijson",
    "pandas",
    "pyarrow",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
